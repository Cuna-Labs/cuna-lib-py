name: release-admission

on:
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Successful py-quality-gates run that produced the immutable handoff
        required: true
        type: string
      tag:
        description: Existing immutable Sigstore-signed py-vX.Y.Z tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: test "${GITHUB_REF}" = "refs/heads/main"
      - run: |
          test "$(gh run view "${{ inputs.admission_run_id }}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${{ inputs.admission_run_id }}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          gh run download "${{ inputs.admission_run_id }}" --name python-admitted-handoff --dir handoff
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python tools/release_handoff_gate.py handoff --source "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-python-handoff
          path: handoff/*
          if-no-files-found: error
          retention-days: 7

  release-admission:
    needs: verify-handoff
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-handoff
          path: handoff
      - run: python -m pip install sigstore==4.5.0
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: python tools/release_handoff_gate.py handoff --source "${GITHUB_SHA}"
      - run: python tools/release_gate.py --tag "${{ inputs.tag }}" --artifacts handoff --evidence handoff/external-release-evidence.json --bundle handoff/external-release-evidence.sigstore.json

  publish:
    needs: [verify-handoff, release-admission]
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-handoff
          path: handoff
      - run: python -m pip install sigstore==4.5.0
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: python tools/release_handoff_gate.py handoff --source "${GITHUB_SHA}"
      - run: python tools/release_gate.py --tag "${{ inputs.tag }}" --artifacts handoff --evidence handoff/external-release-evidence.json --bundle handoff/external-release-evidence.sigstore.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: handoff
