name: release-admission

on:
  pull_request:
  workflow_dispatch:
    inputs:
      phase:
        description: Create the immutable signed tag, or publish a previously verified tag
        required: true
        type: choice
        options:
          - create-tag
          - publish
      candidate_run_id:
        description: Successful py-quality-gates run that produced the immutable pre-tag candidate
        required: false
        type: string
      tag_run_id:
        description: Successful create-tag phase run; required only for publish
        required: false
        type: string
      tag:
        description: Exact py-vX.Y.Z tag to create or consume
        required: true
        type: string
      evidence_run_id:
        description: Successful python-release-evidence run; required only for publish
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: python-release-runa-sdk-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  branch-policy:
    name: release-admission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -c "import json; from tools.release_gate import policy_reachability; assert policy_reachability(json.load(open('.runa/release-policy.json', encoding='utf-8')))"
      - run: test "${GITHUB_EVENT_NAME}" = "pull_request"

  verify-handoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: test "${GITHUB_REF}" = "refs/heads/main"
      - env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        if: inputs.phase == 'create-tag'
        run: |
          test -n "${CANDIDATE_RUN_ID}"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json workflowName --jq .workflowName)" = "py-quality-gates"
          gh run download "${CANDIDATE_RUN_ID}" --name python-candidate-handoff --dir handoff
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_RUN_ID: ${{ inputs.tag_run_id }}
        if: inputs.phase == 'publish'
        run: |
          test -n "${TAG_RUN_ID}"
          test "$(gh run view "${TAG_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${TAG_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${TAG_RUN_ID}" --json workflowName --jq .workflowName)" = "release-admission"
          gh run download "${TAG_RUN_ID}" --name python-tagged-candidate-handoff --dir handoff
      - run: python tools/release_handoff_gate.py handoff --candidate --source "${GITHUB_SHA}"
      - if: inputs.phase == 'publish'
        run: python tools/tag_handoff.py check handoff --source "${GITHUB_SHA}" --tag "${{ inputs.tag }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-python-candidate
          path: handoff/*
          if-no-files-found: error
          retention-days: 7

  tag-authority:
    if: inputs.phase == 'create-tag'
    needs: verify-handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-candidate
          path: handoff
      - run: python tools/release_handoff_gate.py handoff --candidate --source "${GITHUB_SHA}"
      - name: Prove the version is absent before the irreversible tag side effect
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python tools/pypi_absence_gate.py --version "${VERSION}"
      - name: Verify protected-main policy before tag creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" > branch-protection.json
          gh attestation verify handoff/candidate/*.whl --repo "${GITHUB_REPOSITORY}"
          gh attestation verify handoff/candidate/*.tar.gz --repo "${GITHUB_REPOSITORY}"
          jq -e '.required_status_checks.contexts | index("py-quality-gates") != null' branch-protection.json
          jq -e '.required_status_checks.contexts | index("release-admission") != null' branch-protection.json
          test "$(jq -r .required_pull_request_reviews.required_approving_review_count branch-protection.json)" -ge 1
          test "$(jq -r .required_pull_request_reviews.dismiss_stale_reviews branch-protection.json)" = "true"
          test "$(jq -r .required_pull_request_reviews.require_code_owner_reviews branch-protection.json)" = "true"
          python tools/tag_creation_gate.py --tag "${{ inputs.tag }}" --source "${GITHUB_SHA}" --artifacts handoff

  publish-authority:
    if: inputs.phase == 'publish'
    needs: verify-handoff
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-candidate
          path: handoff
      - name: Download independently produced external release evidence
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "${EVIDENCE_RUN_ID}"
          test "$(gh run view "${EVIDENCE_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${EVIDENCE_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${EVIDENCE_RUN_ID}" --json workflowName --jq .workflowName)" = "python-release-evidence"
          gh run download "${EVIDENCE_RUN_ID}" --name python-external-release-evidence --dir handoff
      - run: python tools/release_handoff_gate.py handoff --core --source "${GITHUB_SHA}"
      - run: python -m pip install jsonschema==4.25.1 sigstore==4.5.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.11"
          cache: false
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: python tools/release_gate.py --tag "${{ inputs.tag }}" --artifacts handoff --evidence handoff/external-release-evidence.json --bundle handoff/external-release-evidence.sigstore.json --approval-receipt handoff/approval-receipt.json --approval-signature handoff/approval-receipt.sig --admission-output handoff/release-admission-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-admitted-handoff
          path: handoff/*
          if-no-files-found: error
          retention-days: 1

  create-tag:
    if: inputs.phase == 'create-tag'
    needs: [verify-handoff, tag-authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-python-candidate
          path: handoff
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.11"
          cache: false
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: python tools/tag_creation_gate.py --tag "${{ inputs.tag }}" --source "${GITHUB_SHA}" --artifacts handoff
      - run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
      - name: Create, verify, and push the one immutable tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config --local gpg.format x509
          git config --local gpg.x509.program gitsign
          git tag -s -m "runa-sdk ${TAG}" "${TAG}" "${GITHUB_SHA}"
          gitsign verify --certificate-identity="https://github.com/Runa-Laboratories/runa-lib-py/.github/workflows/release.yml@refs/heads/main" --certificate-oidc-issuer="https://token.actions.githubusercontent.com" "${TAG}"
          git push origin "refs/tags/${TAG}"
      - run: python tools/tag_handoff.py create handoff --source "${GITHUB_SHA}" --tag "${{ inputs.tag }}" --candidate-run-id "${{ inputs.candidate_run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-tagged-candidate-handoff
          path: handoff/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.phase == 'publish'
    needs: [verify-handoff, publish-authority]
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-admitted-handoff
          path: handoff
      - run: python -m pip install jsonschema==4.25.1 sigstore==4.5.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.11"
          cache: false
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: python tools/release_handoff_gate.py handoff --source "${GITHUB_SHA}"
      - run: python tools/release_gate.py --tag "${{ inputs.tag }}" --artifacts handoff --evidence handoff/external-release-evidence.json --bundle handoff/external-release-evidence.sigstore.json --approval-receipt handoff/approval-receipt.json --approval-signature handoff/approval-receipt.sig
      - run: python tools/stage_publish_artifacts.py handoff publish-dist
      - name: Prove this is the first PyPI upload attempt for the exact version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python tools/pypi_absence_gate.py --version "${VERSION}"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist
      - name: Retrieve exact uploaded artifacts
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mkdir retrieved
          python -m pip download --no-deps --only-binary=:all: --dest retrieved "runa-sdk==${VERSION}"
          python -m pip download --no-deps --no-binary=:all: --dest retrieved "runa-sdk==${VERSION}"
      - name: Verify upload and GitHub attestations before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/postpublish_gate.py --expected handoff --retrieved retrieved --repository "${GITHUB_REPOSITORY}"
