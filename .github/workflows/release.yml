name: release-admission

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - run: python -m uv lock --check
      - run: python -m uv build
      - run: python tools/package_gate.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build-once
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: dist
      - run: python -m pip install sigstore==4.5.0
      - run: python tools/package_gate.py dist
      - run: python tools/bind_release_evidence.py --tag "${GITHUB_REF_NAME}" --artifacts dist --output release-evidence.json
        env:
          RUNA_RELEASE_CONTROL_EVIDENCE: ${{ secrets.RUNA_RELEASE_CONTROL_EVIDENCE }}
      - run: python -m sigstore sign --bundle release-evidence.sigstore.json release-evidence.json
      - run: python tools/release_gate.py --tag "${GITHUB_REF_NAME}" --evidence release-evidence.json --bundle release-evidence.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            release-evidence.json
            release-evidence.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-once, verify]
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: .
      - run: python -m pip install sigstore==4.5.0
      - run: python tools/release_gate.py --tag "${GITHUB_REF_NAME}" --evidence release-evidence.json --bundle release-evidence.sigstore.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
