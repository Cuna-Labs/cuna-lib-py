name: py-quality-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Successful signed performance-baseline run
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          cache-dependency-path: contracts/package-lock.json
          node-version: 24.4.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - run: npm ci
        working-directory: contracts
      - run: npm run verify
        working-directory: contracts
      - run: python -m uv lock --check
      - run: python -m uv run ruff format --check .
      - run: python -m uv run ruff check .
      - run: python -m uv run pyright src
      - run: python -m uv run mypy src
      - run: python -m uv run pip-audit
      - run: python -m uv run python tools/dependency_gate.py
      - run: python -m uv run python tools/duplicate_abstraction_gate.py
      - run: python -m uv run --locked python tools/workflow_yaml_gate.py
      - run: python tools/docs_gate.py
      - run: python tools/evidence_gate.py
      - run: python tools/safety_scan.py
      - run: python -m uv build
      - run: python -m uv run --locked python tools/surface_snapshot.py dist/*.whl .runa/public-surface.json --check
      - run: python tools/package_gate.py dist
      - id: attest_wheel
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.whl
      - id: attest_sdist
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Persist and verify GitHub provenance
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_BUNDLE: ${{ steps.attest_wheel.outputs.bundle-path }}
          SDIST_BUNDLE: ${{ steps.attest_sdist.outputs.bundle-path }}
        run: |
          mkdir attestations
          cp "${WHEEL_BUNDLE}" attestations/wheel.intoto.jsonl
          cp "${SDIST_BUNDLE}" attestations/sdist.intoto.jsonl
          gh attestation verify dist/*.whl --repo "${GITHUB_REPOSITORY}"
          gh attestation verify dist/*.tar.gz --repo "${GITHUB_REPOSITORY}"
      - id: contract
        continue-on-error: true
        run: python tools/contract_gate.py > contract-gate.json
      - id: reference
        continue-on-error: true
        run: python -m uv run --locked python tools/generate_api_reference.py dist/*.whl --report api-reference-gate.json
      - name: Stage a flat immutable candidate
        if: always()
        run: |
          mkdir -p candidate-staging
          cp dist/*.whl dist/*.tar.gz contract-gate.json api-reference-gate.json candidate-staging/
          if compgen -G "attestations/*.intoto.jsonl" > /dev/null; then
            cp attestations/*.intoto.jsonl candidate-staging/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-candidate
          path: candidate-staging/*
          if-no-files-found: error
          retention-days: 7
      - if: steps.contract.outcome != 'success' || steps.reference.outcome != 'success'
        run: exit 1

  installed-artifact:
    needs: build-once
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        artifact: ["wheel", "sdist"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.31
      - name: Install locked test harness without installing the source project
        run: |
          python -m uv export --locked --only-group dev --no-emit-project --output-file "${RUNNER_TEMP}/dev-requirements.txt"
          python -m pip install --require-hashes -r "${RUNNER_TEMP}/dev-requirements.txt"
      - name: Install locked runtime dependencies without installing the source project
        run: |
          python -m uv export --locked --no-dev --no-emit-project --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          python -m pip install --require-hashes -r "${RUNNER_TEMP}/runtime-requirements.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - name: Download accepted performance baselines
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          test "$(gh run view "${BASELINE_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${BASELINE_RUN_ID}" --json workflowName --jq .workflowName)" = "performance-baseline-approval"
          BASELINE_SHA="$(gh run view "${BASELINE_RUN_ID}" --json headSha --jq .headSha)"
          gh run download "${BASELINE_RUN_ID}" --name python-performance-baselines --dir baselines
          test "$(jq -r .source baselines/baseline-index.json)" = "${BASELINE_SHA}"
      - if: github.event_name == 'workflow_dispatch'
        run: python tools/performance_baseline_gate.py baselines
      - if: matrix.artifact == 'wheel'
        run: python -m pip install --no-deps candidate/*.whl
      - if: matrix.artifact == 'sdist'
        run: python -m pip install --no-deps --no-build-isolation candidate/*.tar.gz
      - run: python -m pytest -q
      - if: matrix.artifact == 'wheel'
        run: python tools/installed_artifact_gate.py candidate/*.whl > receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
      - if: matrix.artifact == 'sdist'
        run: python tools/installed_artifact_gate.py candidate/*.tar.gz > receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
      - if: matrix.artifact == 'wheel'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python tools/performance_gate.py candidate/*.whl --mode sync --source "${GITHUB_SHA}" --baseline baselines/baseline-${{ matrix.python }}-${{ matrix.artifact }}-sync.json > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            python tools/performance_gate.py candidate/*.whl --mode async --source "${GITHUB_SHA}" --baseline baselines/baseline-${{ matrix.python }}-${{ matrix.artifact }}-async.json > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          else
            python tools/performance_gate.py candidate/*.whl --mode sync --local-diagnostic --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            python tools/performance_gate.py candidate/*.whl --mode async --local-diagnostic --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          fi
      - if: matrix.artifact == 'sdist'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python tools/performance_gate.py candidate/*.tar.gz --mode sync --source "${GITHUB_SHA}" --baseline baselines/baseline-${{ matrix.python }}-${{ matrix.artifact }}-sync.json > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            python tools/performance_gate.py candidate/*.tar.gz --mode async --source "${GITHUB_SHA}" --baseline baselines/baseline-${{ matrix.python }}-${{ matrix.artifact }}-async.json > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          else
            python tools/performance_gate.py candidate/*.tar.gz --mode sync --local-diagnostic --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            python tools/performance_gate.py candidate/*.tar.gz --mode async --local-diagnostic --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          fi
      - run: cd "${RUNNER_TEMP}" && mypy --strict "${GITHUB_WORKSPACE}/tests/typing/consumer.py"
      - run: cd "${RUNNER_TEMP}" && pyright "${GITHUB_WORKSPACE}/tests/typing/consumer.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: receipt-${{ matrix.python }}-${{ matrix.artifact }}
          path: |
            receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
            budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          if-no-files-found: error
          retention-days: 7

  httpx-compatibility:
    needs: build-once
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        httpx: ["0.27.2", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - name: Install locked test harness without installing the source project
        run: |
          python -m uv export --locked --only-group dev --no-emit-project --output-file "${RUNNER_TEMP}/dev-requirements.txt"
          python -m pip install --require-hashes -r "${RUNNER_TEMP}/dev-requirements.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - if: matrix.httpx != 'latest'
        run: python -m pip install "httpx==${{ matrix.httpx }}" pytest==9.0.3 pytest-asyncio==1.4.0
      - if: matrix.httpx == 'latest'
        run: python -m pip install "httpx>=0.27.2,<1" pytest==9.0.3 pytest-asyncio==1.4.0
      - run: python -m pip install --no-deps candidate/*.whl
      - run: python -m pip check
      - run: python -m pytest -q

  admission:
    name: py-quality-gates
    if: always()
    needs: [build-once, installed-artifact, httpx-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-*
          path: receipts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - name: Reverify candidate attestations from the GitHub Attestations API
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify candidate/*.whl --repo "${GITHUB_REPOSITORY}"
          gh attestation verify candidate/*.tar.gz --repo "${GITHUB_REPOSITORY}"
      - name: Emit merge-reachable local admission
        if: github.event_name != 'workflow_dispatch'
        run: python tools/admission_manifest.py --receipts receipts --artifacts candidate --local-only --source "${GITHUB_SHA}" --require-success "${{ needs.build-once.result }}" "${{ needs.installed-artifact.result }}" "${{ needs.httpx-compatibility.result }}" > candidate-manifest.json
      - name: Emit exact pre-tag candidate handoff without release eligibility
        if: github.event_name == 'workflow_dispatch'
        run: python tools/admission_manifest.py --receipts receipts --artifacts candidate --candidate-only --source "${GITHUB_SHA}" --require-success "${{ needs.build-once.result }}" "${{ needs.installed-artifact.result }}" "${{ needs.httpx-compatibility.result }}" > candidate-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-quality-evidence
          path: |
            candidate/*.whl
            candidate/*.tar.gz
            candidate-manifest.json
            receipts/*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: python-candidate-handoff
          path: |
            candidate/*.whl
            candidate/*.tar.gz
            candidate-manifest.json
            receipts/*.json
          if-no-files-found: error
          retention-days: 7
