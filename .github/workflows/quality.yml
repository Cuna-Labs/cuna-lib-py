name: py-quality-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - run: python -m uv lock --check
      - run: python -m uv run ruff format --check .
      - run: python -m uv run ruff check .
      - run: python -m uv run pyright src
      - run: python -m uv run mypy src
      - run: python -m uv run pip-audit
      - run: python -m uv run python tools/dependency_gate.py
      - run: python tools/docs_gate.py
      - run: python tools/evidence_gate.py
      - run: python tools/safety_scan.py
      - run: python -m uv build
      - run: python tools/package_gate.py dist
      - id: contract
        continue-on-error: true
        run: python tools/contract_gate.py > contract-gate.json
      - id: reference
        continue-on-error: true
        run: python tools/generate_api_reference.py dist/*.whl > api-reference-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-candidate
          path: |
            dist/*
            contract-gate.json
            api-reference-gate.json
          if-no-files-found: error
          retention-days: 7
      - if: steps.contract.outcome != 'success' || steps.reference.outcome != 'success'
        run: exit 1

  installed-artifact:
    needs: build-once
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        artifact: ["wheel", "sdist"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - run: python -m pip install --only-binary=:all: httpx==0.28.1 pytest==9.0.3 pytest-asyncio==1.4.0 mypy==1.17.1 pyright==1.1.403 hatchling==1.27.0
      - if: matrix.artifact == 'wheel'
        run: python -m pip install --no-deps candidate/*.whl
      - if: matrix.artifact == 'sdist'
        run: python -m pip install --no-deps --no-build-isolation candidate/*.tar.gz
      - run: python -m pytest -q
      - if: matrix.artifact == 'wheel'
        run: python tools/installed_artifact_gate.py candidate/*.whl > receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
      - if: matrix.artifact == 'sdist'
        run: python tools/installed_artifact_gate.py candidate/*.tar.gz > receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
      - if: matrix.artifact == 'wheel'
        run: |
          python tools/performance_gate.py candidate/*.whl --mode sync --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
          python tools/performance_gate.py candidate/*.whl --mode async --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
      - if: matrix.artifact == 'sdist'
        run: |
          python tools/performance_gate.py candidate/*.tar.gz --mode sync --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
          python tools/performance_gate.py candidate/*.tar.gz --mode async --source "${GITHUB_SHA}" > budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
      - run: cd "${RUNNER_TEMP}" && mypy --strict "${GITHUB_WORKSPACE}/tests/typing/consumer.py"
      - run: cd "${RUNNER_TEMP}" && pyright "${GITHUB_WORKSPACE}/tests/typing/consumer.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: receipt-${{ matrix.python }}-${{ matrix.artifact }}
          path: |
            receipt-${{ matrix.python }}-${{ matrix.artifact }}.json
            budget-${{ matrix.python }}-${{ matrix.artifact }}-sync.json
            budget-${{ matrix.python }}-${{ matrix.artifact }}-async.json
          if-no-files-found: error
          retention-days: 7

  admission:
    name: py-quality-gates
    if: always()
    needs: [build-once, installed-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: receipt-*
          path: receipts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - run: python tools/admission_manifest.py --receipts receipts --artifacts candidate --source "${GITHUB_SHA}" --require-success "${{ needs.build-once.result }}" "${{ needs.installed-artifact.result }}" > admission-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-admitted-handoff
          path: |
            candidate/*.whl
            candidate/*.tar.gz
            admission-manifest.json
            receipts/*.json
          if-no-files-found: error
          retention-days: 7
