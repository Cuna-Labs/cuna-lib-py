name: py-quality-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - run: python -m uv lock --check
      - run: python -m uv run ruff format --check .
      - run: python -m uv run ruff check .
      - run: python -m uv run pyright src
      - run: python -m uv run mypy src
      - run: python -m uv build
      - run: python tools/package_gate.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  installed-artifact:
    needs: build-once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-candidate
          path: candidate
      - run: python -m pip install candidate/*.whl pytest==8.4.1 pytest-asyncio==1.1.0
      - run: python -m pytest -q
      - run: python tools/installed_artifact_gate.py candidate

  admission:
    name: py-quality-gates
    if: always()
    needs: [build-once, installed-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python tools/admission_manifest.py --require-success "${{ needs.build-once.result }}" "${{ needs.installed-artifact.result }}"
