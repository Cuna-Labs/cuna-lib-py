name: python-release-evidence

on:
  workflow_dispatch:
    inputs:
      tag_run_id:
        description: Successful release create-tag run carrying the immutable candidate handoff
        required: true
      inherited_run_id:
        description: Release-authority inherited-evidence run for the tagged candidate
        required: true
      approval_run_id:
        description: Provider approval run for the reconstructed exact core; numeric run ID only
        required: true
      tag:
        description: Existing signed py-vX.Y.Z tag
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  evidence:
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_RUN_ID: ${{ inputs.tag_run_id }}
        run: |
          test "$(gh run view "${TAG_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${TAG_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${TAG_RUN_ID}" --json workflowName --jq .workflowName)" = "release-admission"
          gh run download "${TAG_RUN_ID}" --name python-tagged-candidate-handoff --dir handoff
      - run: python tools/release_handoff_gate.py handoff --candidate --source "${GITHUB_SHA}"
      - run: python tools/tag_handoff.py check handoff --source "${GITHUB_SHA}" --tag "${{ inputs.tag }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CANDIDATE_RUN_ID="$(jq -r .candidateRunId handoff/tag-handoff.json)"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${CANDIDATE_RUN_ID}" --json workflowName --jq .workflowName)" = "py-quality-gates"
          echo "CANDIDATE_RUN_ID=${CANDIDATE_RUN_ID}" >> "${GITHUB_ENV}"
      - run: test "$(git rev-list -n 1 '${{ inputs.tag }}')" = "${GITHUB_SHA}"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.11"
          cache: false
      - run: |
          go install github.com/sigstore/gitsign@v0.16.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Verify tag signer identity and issuer claims
        run: gitsign verify --certificate-identity="https://github.com/Runa-Laboratories/runa-lib-py/.github/workflows/release.yml@refs/heads/main" --certificate-oidc-issuer="https://token.actions.githubusercontent.com" "${{ inputs.tag }}"
      - name: Retrieve canonical post-tag inherited evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INHERITED_RUN_ID: ${{ inputs.inherited_run_id }}
        run: |
          AUTHORITY_REPOSITORY="$(jq -r .authority.repository .runa/approval-trust.json)"
          AUTHORITY_WORKFLOW="$(jq -r .authority.workflow .runa/approval-trust.json)"
          AUTHORITY_EVENT="$(jq -r .authority.event .runa/approval-trust.json)"
          AUTHORITY_REF="$(jq -r .authority.ref .runa/approval-trust.json)"
          test "$(gh api "repos/${AUTHORITY_REPOSITORY}" --jq .visibility)" = "public"
          RUN="$(gh api "repos/${AUTHORITY_REPOSITORY}/actions/runs/${INHERITED_RUN_ID}")"
          test "$(jq -r .conclusion <<<"${RUN}")" = "success"
          test "$(jq -r .path <<<"${RUN}")" = "${AUTHORITY_WORKFLOW}"
          test "$(jq -r .event <<<"${RUN}")" = "${AUTHORITY_EVENT}"
          test "$(jq -r .head_branch <<<"${RUN}")" = "${AUTHORITY_REF}"
          AUTHORITY_HEAD_SHA="$(jq -r .head_sha <<<"${RUN}")"
          echo "AUTHORITY_HEAD_SHA=${AUTHORITY_HEAD_SHA}" >> "${GITHUB_ENV}"
          gh run download "${INHERITED_RUN_ID}" --repo "${AUTHORITY_REPOSITORY}" --name python-inherited-evidence --dir inherited-evidence
      - name: Install checksum-pinned CycloneDX CLI
        run: |
          mkdir -p "${RUNNER_TEMP}/cyclonedx-bin"
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --output "${RUNNER_TEMP}/cyclonedx-bin/cyclonedx-cli" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64"
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  ${RUNNER_TEMP}/cyclonedx-bin/cyclonedx-cli" | sha256sum --check --strict
          chmod 0555 "${RUNNER_TEMP}/cyclonedx-bin/cyclonedx-cli"
          echo "${RUNNER_TEMP}/cyclonedx-bin" >> "${GITHUB_PATH}"
      - name: Validate exact SBOMs with pinned CLI and version-controlled schema
        run: |
          python -m pip install uv==0.11.31
          python -m uv lock --check
          python -m uv run --locked python tools/sbom_gate.py inherited-evidence
      - name: Produce the approval-free post-tag release core
        run: python tools/admission_manifest.py --receipts handoff/receipts --artifacts handoff/candidate --inherited-evidence inherited-evidence --authority-head-sha "${AUTHORITY_HEAD_SHA}" --core-only --source "${GITHUB_SHA}" --require-success success > release-core-manifest.json
      - run: python tools/release_handoff_gate.py . --core --source "${GITHUB_SHA}"
      - name: Independently retrieve the fixed-provider approval receipt
        env:
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .status .runa/approval-trust.json)" = "accepted"
          APPROVAL_REPOSITORY="$(jq -r .authority.repository .runa/approval-trust.json)"
          APPROVAL_WORKFLOW="$(jq -r .authority.workflow .runa/approval-trust.json)"
          APPROVAL_ARTIFACT="$(jq -r .authority.artifactName .runa/approval-trust.json)"
          APPROVAL_EVENT="$(jq -r .authority.event .runa/approval-trust.json)"
          APPROVAL_REF="$(jq -r .authority.ref .runa/approval-trust.json)"
          test "$(gh api "repos/${APPROVAL_REPOSITORY}" --jq .visibility)" = "public"
          RUN="$(gh api "repos/${APPROVAL_REPOSITORY}/actions/runs/${APPROVAL_RUN_ID}")"
          test "$(jq -r .conclusion <<<"${RUN}")" = "success"
          test "$(jq -r .path <<<"${RUN}")" = "${APPROVAL_WORKFLOW}"
          test "$(jq -r .event <<<"${RUN}")" = "${APPROVAL_EVENT}"
          test "$(jq -r .head_branch <<<"${RUN}")" = "${APPROVAL_REF}"
          gh run download "${APPROVAL_RUN_ID}" --repo "${APPROVAL_REPOSITORY}" --name "${APPROVAL_ARTIFACT}" --dir approval
      - name: Verify receipt signature and exact core/artifact binding
        run: python -m uv run --locked python tools/approval_receipt_gate.py . --receipt approval/approval-receipt.json --signature approval/approval-receipt.sig > approval-verification.json
      - name: Record the protected GitHub Environment execution (not approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" > environment-response.json
          jq -c '{environment:.name,requiredReviewerCount:([.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?] | length)}' environment-response.json > environment-protection.json
          test "$(jq -r .environment environment-protection.json)" = "pypi"
          test "$(jq -r .requiredReviewerCount environment-protection.json)" -ge 1
          ENVIRONMENT_EXECUTION="github-environment://repositories/${GITHUB_REPOSITORY_ID}/environments/pypi/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/actors/${GITHUB_ACTOR_ID}"
          python tools/build_external_release_evidence.py --source "${GITHUB_SHA}" --tag "${{ inputs.tag }}" --artifacts . --environment-reference "${ENVIRONMENT_EXECUTION}" --environment pypi --environment-protection environment-protection.json --admission-run-id "${CANDIDATE_RUN_ID}" --admission-head-sha "${GITHUB_SHA}" --admission-conclusion success --admission-workflow py-quality-gates --approval-verification approval-verification.json --output external-release-evidence.json
      - run: python -m uv run --locked sigstore sign --bundle external-release-evidence.sigstore.json external-release-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-external-release-evidence
          path: |
            external-release-evidence.json
            external-release-evidence.sigstore.json
            environment-protection.json
            release-core-manifest.json
            inherited-evidence/*
            approval/approval-receipt.json
            approval/approval-receipt.sig
            approval-verification.json
          if-no-files-found: error
          retention-days: 7
