name: python-release-evidence

on:
  workflow_dispatch:
    inputs:
      admission_run_id:
        description: Successful release-eligible py-quality-gates run
        required: true
      tag:
        description: Existing signed py-vX.Y.Z tag
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  evidence:
    environment: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_RUN_ID: ${{ inputs.admission_run_id }}
        run: |
          test "$(gh run view "${ADMISSION_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${ADMISSION_RUN_ID}" --json headSha --jq .headSha)" = "${GITHUB_SHA}"
          test "$(gh run view "${ADMISSION_RUN_ID}" --json workflowName --jq .workflowName)" = "py-quality-gates"
          gh run download "${ADMISSION_RUN_ID}" --name python-admitted-handoff --dir handoff
      - run: python tools/release_handoff_gate.py handoff --source "${GITHUB_SHA}"
      - run: test "$(git rev-list -n 1 '${{ inputs.tag }}')" = "${GITHUB_SHA}"
      - name: Bind approval to the protected GitHub Environment execution
        run: |
          APPROVAL="github-environment://repositories/${GITHUB_REPOSITORY_ID}/environments/pypi/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/actors/${GITHUB_ACTOR_ID}"
          python tools/build_external_release_evidence.py --source "${GITHUB_SHA}" --tag "${{ inputs.tag }}" --artifacts handoff --approval-reference "${APPROVAL}" --approval-environment pypi --admission-run-id "${{ inputs.admission_run_id }}" --admission-head-sha "${GITHUB_SHA}" --admission-conclusion success --admission-workflow py-quality-gates --output external-release-evidence.json
      - run: python -m pip install sigstore==4.5.0
      - run: python -m sigstore sign --bundle external-release-evidence.sigstore.json external-release-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-external-release-evidence
          path: |
            external-release-evidence.json
            external-release-evidence.sigstore.json
          if-no-files-found: error
          retention-days: 7
