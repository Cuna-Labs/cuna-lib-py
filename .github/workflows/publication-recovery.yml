name: python-publication-recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable py-vX.Y.Z tag being recovered
        required: true
        type: string
      recovery_run_id:
        description: Prior release-admission run containing python-publication-recovery
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: python-release-cuna-sdk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.31
      - run: python -m uv lock --check
      - name: Retrieve the durable failed-publication envelope
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          test "$(gh run view "${RECOVERY_RUN_ID}" --json headSha --jq .headSha)" = "$(git rev-parse '${{ inputs.tag }}^{}')"
          test "$(gh run view "${RECOVERY_RUN_ID}" --json workflowName --jq .workflowName)" = "release-admission"
          gh run download "${RECOVERY_RUN_ID}" --name python-publication-recovery --dir recovery
      - name: Validate the exact core and tag source without requesting PyPI identity
        run: |
          CORE="$(find recovery -type f -name release-core-manifest.json)"
          test -n "${CORE}"
          SOURCE="$(jq -r .source "${CORE}")"
          test "$(git rev-list -n 1 '${{ inputs.tag }}')" = "${SOURCE}"
          python tools/release_handoff_gate.py recovery --source "${SOURCE}"
      - name: Retrieve exact existing registry artifacts without uploading
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mkdir retrieved
          python -m pip download --no-deps --only-binary=:all: --dest retrieved "cuna-sdk==${VERSION}"
          python -m pip download --no-deps --no-binary=:all: --dest retrieved "cuna-sdk==${VERSION}"
      - name: Resume the append-only envelope from a proven registry state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="$(jq -r .state recovery/publication-state.json)"
          if test "${STATE}" = "planned"; then python -m uv run --locked python tools/publication_state.py transition recovery/publication-state.json uploaded-unverified; fi
          python tools/postpublish_gate.py --expected recovery --retrieved retrieved --repository "${GITHUB_REPOSITORY}"
          STATE="$(jq -r .state recovery/publication-state.json)"
          if test "${STATE}" = "uploaded-unverified"; then python -m uv run --locked python tools/publication_state.py transition recovery/publication-state.json registry-verified; fi
          test "$(jq -r .state recovery/publication-state.json)" = "registry-verified"
      - run: python tools/github_release_assets.py stage recovery github-release-assets
      - name: Create or repair only missing GitHub Release assets; never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then gh release create "${TAG}" --verify-tag --title "cuna-sdk ${TAG}" --notes "Immutable Python SDK release evidence for ${TAG}"; fi
          gh release view "${TAG}" --json assets --jq '.assets[].name' > existing-assets.txt
          for asset in github-release-assets/*; do
            if ! grep -Fxq "$(basename "${asset}")" existing-assets.txt; then gh release upload "${TAG}" "${asset}"; fi
          done
          mkdir github-release-retrieved
          gh release download "${TAG}" --dir github-release-retrieved
          python tools/github_release_assets.py verify github-release-assets github-release-retrieved
      - run: python -m uv run --locked python tools/publication_state.py transition recovery/publication-state.json release-assets-verified
      - run: python -m uv run --locked python tools/publication_state.py transition recovery/publication-state.json promoted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-promoted-release-record
          path: recovery/publication-state.json
          if-no-files-found: error
          retention-days: 90
