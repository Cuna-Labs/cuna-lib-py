name: performance-baseline-approval

on:
  workflow_dispatch:
    inputs:
      proposal_run_id:
        description: Successful py-quality-gates diagnostic run
        required: true
      approval_reference:
        description: External owner decision record
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  approve:
    environment: performance-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_RUN_ID: ${{ inputs.proposal_run_id }}
        run: |
          test "$(gh run view "${PROPOSAL_RUN_ID}" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "${PROPOSAL_RUN_ID}" --json workflowName --jq .workflowName)" = "py-quality-gates"
          PROPOSAL_SHA="$(gh run view "${PROPOSAL_RUN_ID}" --json headSha --jq .headSha)"
          test "${PROPOSAL_SHA}" = "${GITHUB_SHA}"
          gh run download "${PROPOSAL_RUN_ID}" --pattern 'receipt-*' --dir proposals
      - run: python tools/accept_performance_baselines.py proposals baselines --source "${GITHUB_SHA}" --approval-reference "${{ inputs.approval_reference }}"
      - run: python -m pip install sigstore==4.5.0
      - run: python -m sigstore sign --bundle baselines/baseline-index.sigstore.json baselines/baseline-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-performance-baselines
          path: baselines/*
          if-no-files-found: error
          retention-days: 30
